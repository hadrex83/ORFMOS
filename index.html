<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#020405" />
  <title>ORFMOS Boot</title>
  <style>
:root {
  --orf-bg-0:#020405;
  --orf-bg-1:#05090b;
  --orf-bg-2:#071014;
  --orf-blue:#4da3ff;
  --orf-green:#67fca0;
  --orf-text:#eef7ff;
  --orf-muted:#71879b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--orf-bg-0);min-height:100%;overscroll-behavior:none}
body{min-height:100vh;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:-35% -10%;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent 0 47%,rgba(77,163,255,.035) 49%,rgba(77,163,255,.09) 50%,rgba(77,163,255,.035) 51%,transparent 53%),repeating-linear-gradient(90deg,transparent 0 46px,rgba(77,163,255,.015) 47px,transparent 48px);transform:translateY(-30%);animation:orfShellSweep 8s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 38%,rgba(52,145,255,.07),transparent 26%),radial-gradient(circle at 50% 65%,rgba(35,93,156,.04),transparent 36%),repeating-linear-gradient(0deg,rgba(255,255,255,.008) 0 1px,transparent 1px 4px)}
.orf-boot-shell{position:relative;z-index:1;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(7,16,20,.86) 0%,rgba(5,8,10,.92) 62%,rgba(2,4,5,.98) 100%);color:var(--orf-text);letter-spacing:.04em;padding:24px 24px 20px}
.orf-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px rgba(0,0,0,.78),inset 0 0 0 1px rgba(77,163,255,.035)}
.orf-trace-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.55}.orf-trace{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(77,163,255,.1),rgba(77,163,255,.68),transparent);filter:drop-shadow(0 0 5px rgba(77,163,255,.32))}.trace-a{width:42%;top:19%;left:-45%;animation:orfTraceA 7.2s ease-in-out infinite}.trace-b{width:34%;bottom:21%;right:-38%;animation:orfTraceB 9.4s ease-in-out infinite 1.1s}.trace-c{width:18%;top:51%;left:-22%;opacity:.55;animation:orfTraceC 12s linear infinite 2.4s}
.orf-brand-lockup{display:flex;flex-direction:column;align-items:center;position:relative;width:min(88vw,650px)}
.orf-logo{display:block;width:min(210px,42vw);height:auto;object-fit:contain;margin-bottom:2px;mix-blend-mode:screen}
.orfmos-logo{display:block;width:min(520px,82vw);height:auto;object-fit:contain;margin-top:-30px;margin-bottom:-30px;mix-blend-mode:screen}
.orf-subtitle{font-size:10px;letter-spacing:.32em;margin-left:.32em;color:var(--orf-muted);margin-top:-5px}
.orf-power-stage{position:relative;width:128px;height:128px;margin-top:34px;display:grid;place-items:center}.orf-orbit{position:absolute;border-radius:50%;border:1px solid rgba(77,163,255,.16)}.orbit-outer{width:124px;height:124px;border-style:dashed;opacity:.55}.orbit-inner{width:104px;height:104px;border-color:rgba(77,163,255,.1)}.orf-power-stage.active .orbit-outer{animation:orfOrbit 8s linear infinite}.orf-power-stage.active .orbit-inner{animation:orfOrbitReverse 5.5s linear infinite}.orf-power-stage.ready .orbit-outer{animation:orfOrbit 18s linear infinite;border-color:rgba(91,255,155,.22)}.orf-power-stage.ready .orbit-inner{border-color:rgba(91,255,155,.14)}.orf-power-stage.off .orf-orbit{opacity:.22}.orf-power-stage.failed .orf-orbit{border-color:rgba(255,110,110,.18)}
.orf-power-ring{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;border:1px solid #234663;background:radial-gradient(circle,rgba(42,105,170,.06),rgba(0,0,0,.04) 65%);box-shadow:0 0 0 8px rgba(77,163,255,.018),inset 0 0 30px rgba(77,163,255,.05)}.orf-power-ring.active{border-color:#347fc8;animation:orfPulse 1.6s ease-in-out infinite}.orf-power-ring.ready{border-color:#55ff95;box-shadow:0 0 30px rgba(56,255,132,.18),inset 0 0 24px rgba(56,255,132,.08)}.orf-power-ring.failed{border-color:#a04444;box-shadow:0 0 24px rgba(255,80,80,.13)}.orf-power-ring.off{border-color:#29445b;opacity:.78}.orf-power-svg{width:38px;height:38px;overflow:visible}.orf-power-stem,.orf-power-arc{fill:none;stroke:#69b8ff;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}.orf-power-ring.off .orf-power-stem,.orf-power-ring.off .orf-power-arc{stroke:#55758f}.orf-power-ring.ready .orf-power-stem,.orf-power-ring.ready .orf-power-arc{stroke:#91ffb5;filter:drop-shadow(0 0 5px rgba(89,255,151,.55))}.orf-power-ring.failed .orf-power-stem,.orf-power-ring.failed .orf-power-arc{stroke:#ff8a8a}
.orf-state{margin-top:24px;font-size:14px;font-weight:750;letter-spacing:.25em;margin-left:.25em;color:#91bca2}.orf-state.active{color:#6bb8ff}.orf-state.ready{color:#86ffaf;text-shadow:0 0 14px rgba(85,255,149,.18)}.orf-state.failed{color:#ff8a8a}.orf-state.off{color:#6d879d}.orf-message{margin-top:10px;min-height:22px;max-width:680px;text-align:center;color:#879bad;font-size:13px;letter-spacing:.035em}.orf-progress-track{position:relative;margin-top:28px;width:min(520px,76vw);height:3px;background:#10202d;border-radius:99px;overflow:hidden}.orf-progress-track::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);transform:translateX(-100%);animation:orfProgressScan 3.6s ease-in-out infinite}.orf-progress-fill{height:100%;background:linear-gradient(90deg,#245b91,#69b8ff);transition:width .55s ease;box-shadow:0 0 12px rgba(77,163,255,.38)}.orf-progress-fill.ready{background:linear-gradient(90deg,#3b9d62,#86ffaf)}.orf-progress-fill.failed{background:linear-gradient(90deg,#713b3b,#ff8a8a)}.orf-progress-text{margin-top:9px;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#58748d;letter-spacing:.12em}.orf-telemetry{margin-top:34px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#425d74;letter-spacing:.12em}.orf-telemetry b{color:#6b89a2;font-weight:600}.orf-boot-id{margin-top:10px;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 8px ui-monospace,SFMono-Regular,Menlo,monospace;color:#2b4256;letter-spacing:.08em}
@keyframes orfPulse{0%,100%{box-shadow:0 0 0 8px rgba(77,163,255,.018),0 0 8px rgba(77,163,255,.05)}50%{box-shadow:0 0 0 11px rgba(77,163,255,.035),0 0 27px rgba(77,163,255,.18)}}@keyframes orfOrbit{to{transform:rotate(360deg)}}@keyframes orfOrbitReverse{to{transform:rotate(-360deg)}}@keyframes orfProgressScan{0%,30%{transform:translateX(-110%)}70%,100%{transform:translateX(110%)}}@keyframes orfShellSweep{from{transform:translateY(-35%)}to{transform:translateY(35%)}}@keyframes orfTraceA{0%,18%{left:-45%;opacity:0}25%{opacity:.8}62%{left:105%;opacity:.65}68%,100%{left:105%;opacity:0}}@keyframes orfTraceB{0%,28%{right:-38%;opacity:0}35%{opacity:.7}72%{right:108%;opacity:.45}78%,100%{right:108%;opacity:0}}@keyframes orfTraceC{0%{left:-22%;opacity:0}8%{opacity:.42}35%{left:108%;opacity:.18}36%,100%{left:108%;opacity:0}}
@media(max-width:600px){.orf-boot-shell{padding:18px 20px 16px}.orf-logo{width:min(185px,42vw)}.orfmos-logo{width:min(470px,88vw);margin-top:-26px;margin-bottom:-27px}.orf-subtitle{font-size:9px;letter-spacing:.27em;margin-left:.27em}.orf-power-stage{width:116px;height:116px;margin-top:28px}.orbit-outer{width:112px;height:112px}.orbit-inner{width:94px;height:94px}.orf-power-ring{width:80px;height:80px}.orf-power-svg{width:34px;height:34px}.orf-telemetry{gap:12px;margin-top:30px}.orf-progress-track{width:min(510px,82vw)}}

</style>

      <div class="orf-subtitle">SYSTEM EXECUTION FABRIC</div>
    </section>

    <section class="orf-power-stage off" id="powerStage" aria-label="Power state">
      <div class="orf-orbit orbit-outer"></div>
      <div class="orf-orbit orbit-inner"></div>
      <div class="orf-power-ring off" id="powerRing">
        <svg class="orf-power-svg" viewBox="0 0 48 48" role="img" aria-label="power">
          <path class="orf-power-stem" d="M24 6v16" />
          <path class="orf-power-arc" d="M14.4 13.8A15 15 0 1 0 33.6 13.8" />
        </svg>
      </div>
    </section>

    <div class="orf-state off" id="stateText">OFF</div>
    <div class="orf-message" id="messageText">ORFMOS execution node is offline</div>

    <div class="orf-progress-track"><div class="orf-progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="orf-progress-text" id="progressText">0%</div>

    <div class="orf-telemetry">
      <span>PHASE <b id="phaseText">IDLE</b></span>
      <span>NODE <b id="nodeText">COLAB_KERNEL</b></span>
      <span>SEQ <b id="sequenceText">0</b></span>
    </div>
    <div class="orf-boot-id" id="bootIdText">ORF_BOOT_IDLE</div>
  </main>
  <script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $('powerStage');
  const ring = $('powerRing');
  const stateText = $('stateText');
  const messageText = $('messageText');
  const progressFill = $('progressFill');
  const progressText = $('progressText');

  function visualClass(state) {
    const s = String(state || 'OFF').toUpperCase();
    if (s === 'READY' || s === 'COMPLETE') return 'ready';
    if (s === 'FAILED' || s === 'ERROR') return 'failed';
    if (s === 'OFF' || s === 'IDLE') return 'off';
    return 'active';
  }

  function normalizeProgress(value) {
    const n = Number(value ?? 0);
    if (!Number.isFinite(n)) return 0;
    return Math.max(0, Math.min(100, n <= 1 ? n * 100 : n));
  }

  function update(state = {}) {
    const systemState = String(state.state || 'OFF').toUpperCase();
    const cls = visualClass(systemState);
    const progress = normalizeProgress(state.progress);

    stage.className = `orf-power-stage ${cls}`;
    ring.className = `orf-power-ring ${cls}`;
    stateText.className = `orf-state ${cls}`;
    progressFill.className = `orf-progress-fill ${cls}`;

    stateText.textContent = systemState;
    messageText.textContent = state.message || (cls === 'ready' ? 'ORFMOS execution node ready' : cls === 'off' ? 'ORFMOS execution node is offline' : 'ORFMOS execution fabric starting');
    progressFill.style.width = `${progress}%`;
    progressText.textContent = `${Math.round(progress)}%`;
    $('phaseText').textContent = String(state.phase || 'IDLE').toUpperCase();
    $('nodeText').textContent = String(state.node || 'COLAB_KERNEL').toUpperCase();
    $('sequenceText').textContent = String(state.sequence ?? 0);
    $('bootIdText').textContent = String(state.boot_id || 'ORF_BOOT_IDLE');

    document.documentElement.dataset.orfState = systemState;
    window.dispatchEvent(new CustomEvent('orf-boot-state', { detail: state }));
  }

  window.ORF_BOOT = Object.freeze({ update });

  // Android can call this directly via evaluateJavascript().
  window.orfBootUpdateJson = (json) => {
    try { update(typeof json === 'string' ? JSON.parse(json) : json); return true; }
    catch (e) { console.error('ORF boot state rejected', e); return false; }
  };

  update({state:'OFF',phase:'IDLE',progress:0,message:'ORFMOS execution node is offline',node:'COLAB_KERNEL',sequence:0,boot_id:'ORF_BOOT_IDLE'});
})();

</script>
